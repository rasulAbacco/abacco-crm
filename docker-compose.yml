# Abacco CRM — production stack for a Hostinger VPS (or any Linux server with Docker).
#
#   cp .env.example .env    (or: bash deploy/scripts/generate-env.sh)
#   docker compose up -d --build
#
# Services: web (Caddy + React app, ports 80/443) → api (Express) ; worker (BullMQ);
# postgres (data) ; redis (queues). Only "web" is reachable from the internet.
name: abacco-crm

x-backend-env: &backend-env
  NODE_ENV: production
  TZ: UTC
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://abacco:${POSTGRES_PASSWORD}@postgres:5432/abacco_crm
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  APP_URL: https://${DOMAIN}
  API_PUBLIC_URL: https://${DOMAIN}
  CORS_ORIGINS: https://${DOMAIN}
  TRUST_PROXY: "1"
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: strict
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
  ENCRYPTION_ACTIVE_KEY_VERSION: ${ENCRYPTION_ACTIVE_KEY_VERSION:-1}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
  SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-587}
  SYSTEM_SMTP_SECURE: ${SYSTEM_SMTP_SECURE:-false}
  SYSTEM_SMTP_USER: ${SYSTEM_SMTP_USER:-}
  SYSTEM_SMTP_PASS: ${SYSTEM_SMTP_PASS:-}
  SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-}
  SES_SNS_TOPIC_ARNS: ${SES_SNS_TOPIC_ARNS:-}
  WORKER_SEND_CONCURRENCY: ${WORKER_SEND_CONCURRENCY:-4}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abacco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: abacco_crm
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abacco -d abacco_crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction is required by BullMQ: evicting keys would drop queued jobs.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  # Applies database migrations and reference data, then exits.
  migrate:
    build: ./backend
    image: abacco-backend:latest
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/seed.js"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  api:
    image: abacco-backend:latest
    restart: unless-stopped
    command: ["node", "src/server.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: abacco-api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging: *logging

  worker:
    image: abacco-backend:latest
    restart: unless-stopped
    command: ["node", "src/workers/workerBootstrap.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: abacco-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 60s # lets in-flight emails finish on restart/deploy
    logging: *logging

  web:
    build: ./frontend
    image: abacco-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
