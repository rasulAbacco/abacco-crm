# ─────────────────────────────────────────────────────────────────────────────
# Abacco CRM — for Hostinger's Docker Manager (hPanel → VPS → Docker Manager →
# Compose → "Compose manually"). Uses the images GitHub builds automatically.
#
# BEFORE DEPLOYING, replace the 7 values in the "SETTINGS" block below
# (everything that starts with CHANGE_ME). Each value appears only once.
# This file then contains your secrets: do NOT commit the filled-in copy.
# ─────────────────────────────────────────────────────────────────────────────
name: abacco-crm

x-settings:
  # Your domain (DNS A record → VPS IP), and an email for HTTPS certificate notices
  domain: &domain CHANGE_ME_crm.yourdomain.com
  acme-email: &acme_email CHANGE_ME_you@yourdomain.com
  # Random letters+digits only (no symbols), 32+ characters each
  postgres-password: &pg_password CHANGE_ME_random_letters_and_digits_1
  redis-password: &redis_password CHANGE_ME_random_letters_and_digits_2
  jwt-secret: &jwt_secret CHANGE_ME_random_letters_and_digits_64_chars
  # "1:" followed by 32 random bytes in base64. BACK IT UP — needed to read saved SMTP passwords.
  encryption-keys: &encryption_keys CHANGE_ME_1:base64key=
  # Any random 24+ characters; type it on https://<domain>/setup to create your login, then set to ""
  setup-token: &setup_token CHANGE_ME_random_letters_and_digits_3

x-backend: &backend
  # Replace "rasulabacco" if the GitHub account/organisation is different (lowercase).
  image: ghcr.io/rasulabacco/abacco-crm-backend:latest
  pull_policy: always
  environment: &backend-env
    NODE_ENV: production
    TZ: UTC
    DOMAIN: *domain
    POSTGRES_PASSWORD: *pg_password
    REDIS_PASSWORD: *redis_password
    JWT_ACCESS_SECRET: *jwt_secret
    ENCRYPTION_KEYS: *encryption_keys
    SETUP_TOKEN: *setup_token
    TRUST_PROXY: "1"
    COOKIE_SECURE: "true"
    COOKIE_SAMESITE: strict
    WORKER_SEND_CONCURRENCY: "4"
    # Optional: mailbox for password-reset emails
    SYSTEM_SMTP_HOST: ""
    SYSTEM_SMTP_PORT: "587"
    SYSTEM_SMTP_USER: ""
    SYSTEM_SMTP_PASS: ""
    SYSTEM_MAIL_FROM: ""
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abacco
      POSTGRES_PASSWORD: *pg_password
      POSTGRES_DB: abacco_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abacco -d abacco_crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction --appendonly yes"]
    environment:
      REDIS_PASSWORD: *redis_password
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations, then exits (runs again on every redeploy).
  migrate:
    <<: *backend
    command: ["sh", "scripts/container-start.sh", "migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    command: ["sh", "scripts/container-start.sh", "api"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *backend
    command: ["sh", "scripts/container-start.sh", "worker"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 60s

  web:
    image: ghcr.io/rasulabacco/abacco-crm-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: *domain
      ACME_EMAIL: *acme_email
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config: