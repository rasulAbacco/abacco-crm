# Builds the two Docker images on GitHub's servers and publishes them to
# GitHub Container Registry (ghcr.io) on every push to main.
# Hostinger's Docker Manager then only has to download and run them.
#
#   ghcr.io/<owner>/abacco-crm-backend:latest   (API, worker, migrations)
#   ghcr.io/<owner>/abacco-crm-web:latest       (React app + Caddy HTTPS)
name: Build Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/abacco-crm-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}